name: Publish RetreatUI Launcher v0.3.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.6.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.3.6 build
        env:
          BUILD_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-1ed0-8243-bdbe-7a58df0749d3/raw?se=2026-08-06T15%3A01%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=39549553-9990-5571-8de8-d9e2f4aea61b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T07%3A50%3A36Z&ske=2026-08-07T07%3A50%3A36Z&sks=b&skv=2026-02-06&sig=QnKkGME1vLxVRau9Zk4ncllK/FrR7dJDek2a9GVxzIk%3D"
        run: |
          curl --fail --location --retry 3 "$BUILD_URL" --output artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/publish/RetreatUI_Launcher.exe
          test -f artifact/publish/RetreatUI_Launcher.exe.sha256
          test -f artifact/RetreatUI_Launcher_win-x64.zip
          cd artifact/publish
          sha256sum --check RetreatUI_Launcher.exe.sha256

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Reference-accurate layout

          - Rebuilds the WPF launcher layout against the approved reference composition.
          - Uses fixed reference proportions inside a single scaling surface so Windows DPI cannot crop the release panel or footer.
          - Keeps all three lower buttons fully visible and readable.
          - Preserves the integrated Project Ascension and Burning Crusade branding, dark fantasy panels and gold accents.
          - Preserves the v0.3.5 CDN update feed, CoA/TBC separation, Stable/Beta channels and SHA-256 validation.

          Users already running v0.3.5 receive this release automatically through the CDN feed.
          NOTES

      - name: Publish public launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create launcher-v0.3.6 \
            artifact/publish/RetreatUI_Launcher.exe \
            artifact/publish/RetreatUI_Launcher.exe.sha256 \
            artifact/RetreatUI_Launcher_win-x64.zip \
            --repo RetreatUI/RetreatUI-Launcher-Releases \
            --title "RetreatUI Launcher v0.3.6" \
            --notes-file release-notes.md

      - name: Update launcher CDN feed and remove temporary workflow
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          feed_path = Path('feed/launcher-releases.json')
          releases = json.loads(feed_path.read_text()) if feed_path.exists() else []
          releases = [r for r in releases if r.get('tag_name') != 'launcher-v0.3.6']
          releases.insert(0, {
              'tag_name': 'launcher-v0.3.6',
              'name': 'RetreatUI Launcher v0.3.6',
              'body': 'Reference-accurate fixed-proportion WPF layout with a fully visible release panel and footer, while preserving the v0.3.5 CDN update path.',
              'draft': False,
              'prerelease': False,
              'published_at': '2026-08-06T14:56:00Z',
              'assets': [
                  {
                      'name': 'RetreatUI_Launcher.exe',
                      'browser_download_url': 'https://github.com/RetreatUI/RetreatUI-Launcher-Releases/releases/download/launcher-v0.3.6/RetreatUI_Launcher.exe',
                      'size': 72033797
                  },
                  {
                      'name': 'RetreatUI_Launcher.exe.sha256',
                      'browser_download_url': 'https://github.com/RetreatUI/RetreatUI-Launcher-Releases/releases/download/launcher-v0.3.6/RetreatUI_Launcher.exe.sha256',
                      'size': 90
                  }
              ]
          })
          feed_path.parent.mkdir(parents=True, exist_ok=True)
          feed_path.write_text(json.dumps(releases[:30], indent=2) + '\n')
          PY
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git rm .github/workflows/publish-v0.3.6.yml
          git add feed/launcher-releases.json
          git commit -m "Publish launcher v0.3.6 and update CDN feed"
          git push
