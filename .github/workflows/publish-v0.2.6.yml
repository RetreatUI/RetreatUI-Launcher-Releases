name: Publish RetreatUI Launcher v0.2.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: launcher-v0.2.6
      ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-bd80-81f4-8785-b85034f6da78/raw?se=2026-07-30T08:12:46Z&sp=r&sv=2026-02-06&sr=b&scid=5a636d27-b742-55f4-95f3-f0b90cfb36cd&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T05:33:05Z&ske=2026-08-01T05:33:05Z&sks=b&skv=2026-02-06&sig=QNAkO6/jOO/qsI9xwut9CcdusAQfk4buIpvwCI0XgxI%3D"
      ARTIFACT_SHA256: 2e94fe0d09f63eeb6cb66b639f2db3cd37942c5e7cd461cfb2eaf3547a1c0a5f

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated build artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output launcher-artifact.zip
          echo "$ARTIFACT_SHA256  launcher-artifact.zip" | sha256sum -c -
          unzip -q launcher-artifact.zip -d artifact

      - name: Validate release files
        run: |
          test -f artifact/publish/RetreatUI_Launcher.exe
          test -f artifact/publish/RetreatUI_Launcher.exe.sha256
          test -f artifact/RetreatUI_Launcher_win-x64.zip
          (cd artifact/publish && sha256sum -c RetreatUI_Launcher.exe.sha256)
          cp artifact/publish/RetreatUI_Launcher.exe .
          cp artifact/publish/RetreatUI_Launcher.exe.sha256 .
          cp artifact/RetreatUI_Launcher_win-x64.zip .

      - name: Publish public launcher release
        run: |
          cat > release-notes.md <<'MD'
          ## RetreatUI Launcher v0.2.6

          This is the transition release that enables permanent automatic launcher updates.

          ### Self-update channel
          - Launcher updates are now read from this public binary-only repository.
          - The private launcher source repository remains private.
          - Future launcher versions can be downloaded and installed from inside the launcher.

          ### Update safety
          - Every launcher EXE must include a matching SHA-256 checksum asset.
          - Downloads are verified before the existing launcher is changed.
          - The current executable is backed up during replacement.
          - The previous launcher is restored automatically if the new executable cannot start.

          Users upgrading from v0.2.5 or older must install v0.2.6 manually once. Future updates can then be installed directly from the launcher.
          MD

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RetreatUI_Launcher.exe RetreatUI_Launcher.exe.sha256 RetreatUI_Launcher_win-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "RetreatUI Launcher v0.2.6" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" RetreatUI_Launcher.exe RetreatUI_Launcher.exe.sha256 RetreatUI_Launcher_win-x64.zip --repo "$GITHUB_REPOSITORY" --title "RetreatUI Launcher v0.2.6" --notes-file release-notes.md --latest
          fi
