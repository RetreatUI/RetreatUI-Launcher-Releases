name: Publish RetreatUI Launcher v0.3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download verified v0.3.1 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2204-81f4-8850-2a74e25dbcd7/raw?se=2026-08-06T10%3A20%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=d2191af1-cda8-5280-80a4-59996caa9921&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T07%3A09%3A24Z&ske=2026-08-07T07%3A09%3A24Z&sks=b&skv=2026-02-06&sig=xVYzaC2o10qyoTwXsfoiP8MPaXvcfdjB22h2wENr/iA%3D'
          Invoke-WebRequest -Uri $url -OutFile 'artifact.zip'
          Expand-Archive -LiteralPath 'artifact.zip' -DestinationPath 'artifact' -Force

          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe' 'RetreatUI_Launcher.exe'
          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe.sha256' 'RetreatUI_Launcher.exe.sha256'
          Copy-Item 'artifact/RetreatUI_Launcher_win-x64.zip' 'RetreatUI_Launcher_win-x64.zip'

          $expected = (Get-Content 'RetreatUI_Launcher.exe.sha256' -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath 'RetreatUI_Launcher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Checksum mismatch: expected $expected, received $actual"
          }

          $version = (Get-Item 'RetreatUI_Launcher.exe').VersionInfo.FileVersion
          if (!$version.StartsWith('0.3.1')) {
            throw "Unexpected launcher version: $version"
          }

      - name: Publish public launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.3.1
          name: RetreatUI Launcher v0.3.1
          body: |
            ## Dark CoA and TBC theme
            - Replaced the light launcher canvas with an explicit dark navy and charcoal background.
            - Added a dark native Windows title bar.
            - Added a Project Ascension watermark to the Conquest of Azeroth selector.
            - Added a Burning Crusade watermark to the TBC selector.
            - The larger installation-panel watermark now changes with the selected game.
            - Refined the gold accents, panel borders, buttons and launcher typography.

            ## Existing functionality
            The independent CoA and TBC folders, Stable/Beta channels, automatic updates and product-specific release filtering from v0.3.0 remain unchanged.
          draft: false
          prerelease: false
          files: |
            RetreatUI_Launcher.exe
            RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
