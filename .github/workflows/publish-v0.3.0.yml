name: Publish RetreatUI Launcher v0.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download verified v0.3.0 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdmntprukwest.oaiusercontent.com/files/00000000-e514-8243-bff7-5dd04b322f15/raw?se=2026-08-06T09%3A46%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=3ebc1c38-6ac0-5892-982d-d6a7d3b9903d&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T07%3A10%3A02Z&ske=2026-08-07T07%3A10%3A02Z&sks=b&skv=2026-02-06&sig=V%2BlLYmC9uiPj6PuOAHXTNbQJsmEF4hlhKsKYYTKqsJE%3D'
          Invoke-WebRequest -Uri $url -OutFile 'artifact.zip'
          Expand-Archive -LiteralPath 'artifact.zip' -DestinationPath 'artifact' -Force

          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe' 'RetreatUI_Launcher.exe'
          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe.sha256' 'RetreatUI_Launcher.exe.sha256'
          Copy-Item 'artifact/RetreatUI_Launcher_win-x64.zip' 'RetreatUI_Launcher_win-x64.zip'

          $expected = (Get-Content 'RetreatUI_Launcher.exe.sha256' -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath 'RetreatUI_Launcher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Checksum mismatch: expected $expected, received $actual"
          }

          $version = (Get-Item 'RetreatUI_Launcher.exe').VersionInfo.FileVersion
          if (!$version.StartsWith('0.3.0')) {
            throw "Unexpected launcher version: $version"
          }

      - name: Publish public launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.3.0
          name: RetreatUI Launcher v0.3.0
          body: |
            ## CoA and TBC support
            - Redesigned the launcher around a clear Conquest of Azeroth / The Burning Crusade selector.
            - Added independent AddOns folders, executable detection and installed-version state for both games.
            - Existing launcher settings are preserved and migrated into the CoA profile.
            - Stable and Beta channels remain available for each selected game.
            - Product-specific asset filtering prevents TBC from ever installing a CoA package, and vice versa.

            ## TBC packages
            TBC releases use `RetreatUI_TBC_v<version>.zip`. Until the first compatible TBC addon package is published, the launcher displays a clear not-published state instead of falling back to CoA.
          draft: false
          prerelease: false
          files: |
            RetreatUI_Launcher.exe
            RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
