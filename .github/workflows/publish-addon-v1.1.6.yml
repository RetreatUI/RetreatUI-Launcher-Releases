# Server-scheduled publisher; removes itself after a successful release.
name: Publish RetreatUI addon v1.1.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-addon-v1.1.6.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Download exact addon source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/RetreatUI/RetreatUI-Addon/archive/c01f5a4b751c4a458eac3b4d67471406d43882b8.zip" \
            --output source.zip
          unzip -q source.zip -d source
          SOURCE_ROOT="$(find source -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$SOURCE_ROOT"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Validate and package addon
        shell: bash
        run: |
          set -euo pipefail
          core="$(sed -n 's/^## Version:[[:space:]]*//p' "$SOURCE_ROOT/RetreatUI/RetreatUI.toc" | head -n1 | tr -d '\r')"
          classes="$(sed -n 's/^## Version:[[:space:]]*//p' "$SOURCE_ROOT/RetreatUI_Classes/RetreatUI_Classes.toc" | head -n1 | tr -d '\r')"
          test "$core" = "1.1.6"
          test "$classes" = "1.1.6"

          rm -rf package dist
          mkdir -p package dist
          cp -a "$SOURCE_ROOT/RetreatUI" package/RetreatUI
          cp -a "$SOURCE_ROOT/RetreatUI_Classes" package/RetreatUI_Classes
          cd package
          zip -qr ../dist/RetreatUI_v1.1.6.zip RetreatUI RetreatUI_Classes
          cd ..
          test -s dist/RetreatUI_v1.1.6.zip
          unzip -l dist/RetreatUI_v1.1.6.zip | grep -q 'RetreatUI/RetreatUI.toc'
          unzip -l dist/RetreatUI_v1.1.6.zip | grep -q 'RetreatUI_Classes/RetreatUI_Classes.toc'
          sha256sum dist/RetreatUI_v1.1.6.zip > dist/RetreatUI_v1.1.6.zip.sha256

      - name: Publish verified addon asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view addon-v1.1.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete addon-v1.1.6 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create addon-v1.1.6 \
            dist/RetreatUI_v1.1.6.zip \
            dist/RetreatUI_v1.1.6.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "RetreatUI 1.1.6" \
            --notes "Verified launcher package for RetreatUI 1.1.6. Includes the Guardian Formation placement fix, screenshot-approved Witch Doctor Totem Bar placement, TurboPlates threat coloring, HUD duplicate protection, and party-frame text fixes."

      - name: Update addon release feed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          feed_path = Path('feed/addon-releases.json')
          releases = json.loads(feed_path.read_text()) if feed_path.exists() else []
          releases = [item for item in releases if item.get('tag_name') != 'v1.1.6']
          size = Path('dist/RetreatUI_v1.1.6.zip').stat().st_size
          releases.insert(0, {
              'tag_name': 'v1.1.6',
              'name': 'RetreatUI 1.1.6',
              'body': 'Guardian Formation and Witch Doctor Totem Bar placement fixes, TurboPlates no-aggro coloring, HUD duplicate protection, and party-frame text improvements.',
              'draft': False,
              'prerelease': False,
              'published_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'assets': [{
                  'name': 'RetreatUI_v1.1.6.zip',
                  'browser_download_url': 'https://github.com/RetreatUI/RetreatUI-Launcher-Releases/releases/download/addon-v1.1.6/RetreatUI_v1.1.6.zip',
                  'size': size,
              }],
          })
          feed_path.parent.mkdir(parents=True, exist_ok=True)
          feed_path.write_text(json.dumps(releases[:30], indent=2) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/addon-releases.json
          git rm .github/workflows/publish-addon-v1.1.6.yml
          git commit -m "Publish verified RetreatUI 1.1.6 package"
          git push
