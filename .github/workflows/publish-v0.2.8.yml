name: Publish RetreatUI Launcher v0.2.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.8
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'publish/launcher-v0.2.8'
    runs-on: ubuntu-latest
    env:
      TAG: launcher-v0.2.8
      EXE_SHA256: 470b7353723db9ddbe12943e54eab4d2b080a40dabb6c1fd1c59d0c7a879b2e0
      ZIP_SHA256: 668872b79b96d1292a9e2daa222719c42a59872a701be400ebed63c56b734b62
      ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-263c-8243-99ce-ea67abeab16d/raw?se=2026-07-30T17:12:30Z&sp=r&sv=2026-02-06&sr=b&scid=76b6fbc6-5972-5374-85af-dcabf9478d88&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-30T05:47:34Z&ske=2026-08-01T05:47:34Z&sks=b&skv=2026-02-06&sig=AjBygBQS%2BijOemc06wZEDreaPdPUEmEY7GW5%2BqvQajc%3D'

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4

      - name: Download verified source artifact
        run: |
          curl --fail --location --retry 3 --output launcher-artifact.zip "$ARTIFACT_URL"
          unzip -q launcher-artifact.zip -d artifact
          test -f artifact/publish/RetreatUI_Launcher.exe
          test -f artifact/publish/RetreatUI_Launcher.exe.sha256
          test -f artifact/RetreatUI_Launcher_win-x64.zip

      - name: Verify checksums and archive contents
        run: |
          echo "$EXE_SHA256  artifact/publish/RetreatUI_Launcher.exe" | sha256sum -c -
          echo "$ZIP_SHA256  artifact/RetreatUI_Launcher_win-x64.zip" | sha256sum -c -
          (cd artifact/publish && sha256sum -c RetreatUI_Launcher.exe.sha256)
          unzip -tq artifact/RetreatUI_Launcher_win-x64.zip
          unzip -p artifact/RetreatUI_Launcher_win-x64.zip RetreatUI_Launcher.exe | sha256sum | grep -F "$EXE_SHA256"

      - name: Publish public launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'MD'
          ## RetreatUI Launcher v0.2.8

          ### Automatic updates
          - The launcher now installs newer launcher versions automatically and restarts itself after checksum verification.
          - RetreatUI addon updates install automatically on the selected Stable or Beta channel.
          - First-time installation and switching between Stable and Beta remain manual actions.
          - Addon updates wait when Project Ascension is running.

          ### Support RetreatUI
          - Added a discreet **Support RetreatUI** button that opens the official Ko-fi page.
          - Support remains completely optional and RetreatUI remains free to download and use.
          MD

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifact/publish/RetreatUI_Launcher.exe \
              artifact/publish/RetreatUI_Launcher.exe.sha256 \
              artifact/RetreatUI_Launcher_win-x64.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI Launcher v0.2.8' \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              artifact/publish/RetreatUI_Launcher.exe \
              artifact/publish/RetreatUI_Launcher.exe.sha256 \
              artifact/RetreatUI_Launcher_win-x64.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'RetreatUI Launcher v0.2.8' \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Verify published public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = 'false'
          mkdir verify
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_Launcher.exe' \
            --pattern 'RetreatUI_Launcher.exe.sha256' \
            --pattern 'RetreatUI_Launcher_win-x64.zip' \
            --dir verify
          echo "$EXE_SHA256  verify/RetreatUI_Launcher.exe" | sha256sum -c -
          echo "$ZIP_SHA256  verify/RetreatUI_Launcher_win-x64.zip" | sha256sum -c -
          (cd verify && sha256sum -c RetreatUI_Launcher.exe.sha256)
