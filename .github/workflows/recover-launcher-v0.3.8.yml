name: Recover RetreatUI Launcher v0.3.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-launcher-v0.3.8.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Recover exact verified 0.3.8 assets from runner cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $workRoot = Split-Path -Parent $env:RUNNER_WORKSPACE
          $source = Join-Path $workRoot "RetreatUI-Launcher\RetreatUI-Launcher\dist"
          Write-Host "Recovering from $source"
          $names = @("RetreatUI_Launcher.exe", "RetreatUI_Launcher.exe.sha256", "RetreatUI_Launcher_win-x64.zip")
          foreach ($name in $names) {
            $from = Join-Path $source $name
            if (!(Test-Path -LiteralPath $from)) { throw "Cached verified asset is missing: $from" }
            Copy-Item -LiteralPath $from -Destination (Join-Path "dist" $name) -Force
          }
          $exe = "dist/RetreatUI_Launcher.exe"
          $checksum = "dist/RetreatUI_Launcher.exe.sha256"
          $zip = "dist/RetreatUI_Launcher_win-x64.zip"
          if ((Get-Item -LiteralPath $exe).Length -ne 72064586) { throw "Unexpected EXE size." }
          if ((Get-Item -LiteralPath $checksum).Length -ne 90) { throw "Unexpected checksum size." }
          if ((Get-Item -LiteralPath $zip).Length -ne 66592334) { throw "Unexpected ZIP size." }
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne "5aaf2a44a57c51fcdaef1cb7bd568a46fa9b481f3a4c833a998477ec6a0a904d") { throw "EXE hash mismatch: $exeHash" }
          if ($zipHash -ne "3be17c87589d56ad1844529114f9247cc7c92c917bafbf537644b952652014b0") { throw "ZIP hash mismatch: $zipHash" }
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim().Split()[0].ToLowerInvariant()
          if ($expected -ne $exeHash) { throw "Checksum file does not match EXE." }

      - name: Publish public launcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          @"
          ## RetreatUI Launcher 0.3.8

          - Removes blurred edition-card artwork and keeps selected text sharp.
          - Corrects the Burning Crusade label.
          - Uses only verified GitHub release assets for Latest on channel.
          - Compares public feeds with live GitHub releases and rejects stale or invalid entries.
          - Includes SHA-256 verification assets.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release view launcher-v0.3.8 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload launcher-v0.3.8 `
              "dist/RetreatUI_Launcher.exe" `
              "dist/RetreatUI_Launcher.exe.sha256" `
              "dist/RetreatUI_Launcher_win-x64.zip" `
              --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit launcher-v0.3.8 --repo $env:GITHUB_REPOSITORY --title "RetreatUI Launcher v0.3.8" --notes-file release-notes.md
          } else {
            gh release create launcher-v0.3.8 `
              "dist/RetreatUI_Launcher.exe" `
              "dist/RetreatUI_Launcher.exe.sha256" `
              "dist/RetreatUI_Launcher_win-x64.zip" `
              --repo $env:GITHUB_REPOSITORY `
              --title "RetreatUI Launcher v0.3.8" `
              --notes-file release-notes.md
          }

      - name: Verify published assets and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/launcher-v0.3.8" | ConvertFrom-Json
          $expected = @{
            "RetreatUI_Launcher.exe" = 72064586
            "RetreatUI_Launcher.exe.sha256" = 90
            "RetreatUI_Launcher_win-x64.zip" = 66592334
          }
          foreach ($name in $expected.Keys) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (!$asset) { throw "Missing public asset: $name" }
            if ([int64]$asset.size -ne [int64]$expected[$name]) { throw "Public size mismatch: $name" }
            if ($asset.browser_download_url -notlike "*/releases/download/launcher-v0.3.8/*") { throw "Unexpected public URL: $name" }
          }
          $feedPath = "feed/launcher-releases.json"
          $items = @(Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json)
          $items = @($items | Where-Object { $_.tag_name -ne "launcher-v0.3.8" })
          $assets = @()
          foreach ($name in @("RetreatUI_Launcher.exe", "RetreatUI_Launcher.exe.sha256", "RetreatUI_Launcher_win-x64.zip")) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            $assets += [ordered]@{ name = $asset.name; browser_download_url = $asset.browser_download_url; size = [int64]$asset.size }
          }
          $entry = [ordered]@{
            tag_name = "launcher-v0.3.8"
            name = "RetreatUI Launcher v0.3.8"
            body = "Sharp edition cards, corrected Burning Crusade label, verified release selection, merged feed/API update checks, and SHA-256 verification."
            draft = $false
            prerelease = $false
            published_at = $release.published_at
            assets = $assets
          }
          $all = @($entry) + $items
          $json = $all | Select-Object -First 30 | ConvertTo-Json -Depth 8
          Set-Content -LiteralPath $feedPath -Value $json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $feedPath
          git rm .github/workflows/recover-launcher-v0.3.8.yml
          git commit -m "Publish verified launcher 0.3.8 and update feed"
          git push
