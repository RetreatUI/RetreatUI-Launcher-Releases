name: Recover RetreatUI Launcher v0.3.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-launcher-v0.3.8.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact verified 0.3.8 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 'https://release-assets.githubusercontent.com/github-production-release-asset/1315203427/ab94be76-cae0-49c4-a8b8-1a56f3296370?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-07T08%3A14%3A20Z&rscd=attachment%3B+filename%3DRetreatUI_Launcher.exe&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-07T07%3A13%3A21Z&ske=2026-08-07T08%3A14%3A20Z&sks=b&skv=2018-11-09&sig=cYPiQPpq7DAsqiDItKdlCwnmEwCqpT0hUCyQg2QMNko%3D' -o dist/RetreatUI_Launcher.exe
          curl --fail --location --retry 3 'https://release-assets.githubusercontent.com/github-production-release-asset/1315203427/ffc1e8e9-16af-4133-b032-c502f89efa8a?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-07T08%3A09%3A25Z&rscd=attachment%3B+filename%3DRetreatUI_Launcher.exe.sha256&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-07T07%3A08%3A30Z&ske=2026-08-07T08%3A09%3A25Z&sks=b&skv=2018-11-09&sig=GL0ry%2BIbwQdmX0CosDOk5COo00JLRclETz5OBVHhGtQ%3D' -o dist/RetreatUI_Launcher.exe.sha256
          curl --fail --location --retry 3 'https://release-assets.githubusercontent.com/github-production-release-asset/1315203427/3d60da97-bd4e-427c-b222-5cb26ffc0e6b?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-07T07%3A54%3A03Z&rscd=attachment%3B+filename%3DRetreatUI_Launcher_win-x64.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-07T06%3A53%3A48Z&ske=2026-08-07T07%3A54%3A03Z&sks=b&skv=2018-11-09&sig=0ku8IZqC68gEqUC5q56owE9JlCJ3QvQYN8Gd4CN64XU%3D' -o dist/RetreatUI_Launcher_win-x64.zip

          test "$(stat -c%s dist/RetreatUI_Launcher.exe)" = '72064586'
          test "$(stat -c%s dist/RetreatUI_Launcher.exe.sha256)" = '90'
          test "$(stat -c%s dist/RetreatUI_Launcher_win-x64.zip)" = '66592334'
          echo '5aaf2a44a57c51fcdaef1cb7bd568a46fa9b481f3a4c833a998477ec6a0a904d  dist/RetreatUI_Launcher.exe' | sha256sum -c -
          echo '3be17c87589d56ad1844529114f9247cc7c92c917bafbf537644b952652014b0  dist/RetreatUI_Launcher_win-x64.zip' | sha256sum -c -
          grep -qi '^5aaf2a44a57c51fcdaef1cb7bd568a46fa9b481f3a4c833a998477ec6a0a904d' dist/RetreatUI_Launcher.exe.sha256

      - name: Publish public launcher release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## RetreatUI Launcher 0.3.8

          - Removes blurred edition-card artwork and keeps selected text sharp.
          - Corrects the Burning Crusade label.
          - Uses only verified GitHub release assets for Latest on channel.
          - Compares public feeds with live GitHub releases and rejects stale or invalid entries.
          - Includes SHA-256 verification assets.
          EOF
          if gh release view launcher-v0.3.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload launcher-v0.3.8 dist/RetreatUI_Launcher.exe dist/RetreatUI_Launcher.exe.sha256 dist/RetreatUI_Launcher_win-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit launcher-v0.3.8 --repo "$GITHUB_REPOSITORY" --title 'RetreatUI Launcher v0.3.8' --notes-file release-notes.md
          else
            gh release create launcher-v0.3.8 dist/RetreatUI_Launcher.exe dist/RetreatUI_Launcher.exe.sha256 dist/RetreatUI_Launcher_win-x64.zip --repo "$GITHUB_REPOSITORY" --title 'RetreatUI Launcher v0.3.8' --notes-file release-notes.md
          fi

      - name: Verify published assets and update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/launcher-v0.3.8" > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          expected = {
              'RetreatUI_Launcher.exe': (72064586, 'sha256:5aaf2a44a57c51fcdaef1cb7bd568a46fa9b481f3a4c833a998477ec6a0a904d'),
              'RetreatUI_Launcher.exe.sha256': (90, None),
              'RetreatUI_Launcher_win-x64.zip': (66592334, 'sha256:3be17c87589d56ad1844529114f9247cc7c92c917bafbf537644b952652014b0'),
          }
          assets = {a['name']: a for a in release['assets']}
          for name, (size, digest) in expected.items():
              a = assets.get(name)
              assert a, f'missing {name}'
              assert a['size'] == size, (name, a['size'], size)
              assert '/releases/download/launcher-v0.3.8/' in a['browser_download_url']
              if digest and a.get('digest'):
                  assert a['digest'] == digest, (name, a.get('digest'), digest)

          feed = Path('feed/launcher-releases.json')
          releases = json.loads(feed.read_text()) if feed.exists() else []
          releases = [r for r in releases if r.get('tag_name') != 'launcher-v0.3.8']
          releases.insert(0, {
              'tag_name': 'launcher-v0.3.8',
              'name': 'RetreatUI Launcher v0.3.8',
              'body': 'Sharp edition cards, corrected Burning Crusade label, verified release selection, merged feed/API update checks, and SHA-256 verification.',
              'draft': False,
              'prerelease': False,
              'published_at': release['published_at'],
              'assets': [
                  {'name': a['name'], 'browser_download_url': a['browser_download_url'], 'size': a['size']}
                  for a in release['assets'] if a['name'] in expected
              ],
          })
          feed.write_text(json.dumps(releases[:30], indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/launcher-releases.json
          git rm .github/workflows/recover-launcher-v0.3.8.yml
          git commit -m 'Publish verified launcher 0.3.8 and update feed'
          git push
