name: Publish RetreatUI Launcher v0.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download verified v0.3.2 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-34d8-8246-8fb5-4ae064c76b15/raw?se=2026-08-06T10%3A55%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=435aa944-1dc5-5870-acd4-88b82058615b&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T06%3A45%3A00Z&ske=2026-08-07T06%3A45%3A00Z&sks=b&skv=2026-02-06&sig=wl5iejA2froIh4CdoESUTyePb2ax03PO/26mMonsiIA%3D'
          Invoke-WebRequest -Uri $url -OutFile 'artifact.zip'
          Expand-Archive -LiteralPath 'artifact.zip' -DestinationPath 'artifact' -Force

          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe' 'RetreatUI_Launcher.exe'
          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe.sha256' 'RetreatUI_Launcher.exe.sha256'
          Copy-Item 'artifact/RetreatUI_Launcher_win-x64.zip' 'RetreatUI_Launcher_win-x64.zip'

          $expected = (Get-Content 'RetreatUI_Launcher.exe.sha256' -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath 'RetreatUI_Launcher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Checksum mismatch: expected $expected, received $actual"
          }

          $version = (Get-Item 'RetreatUI_Launcher.exe').VersionInfo.FileVersion
          if (!$version.StartsWith('0.3.2')) {
            throw "Unexpected launcher version: $version"
          }

      - name: Publish public launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.3.2
          name: RetreatUI Launcher v0.3.2
          body: |
            ## More vivid game selection
            - Replaced the flat watermark-style cards with integrated hero compositions.
            - Gave Conquest of Azeroth a distinct blue and arcane identity.
            - Gave The Burning Crusade a distinct gold and fel identity.
            - Increased logo clarity while keeping the branding integrated into the cards.
            - Added richer background glows and clearer selected-game accents.
            - Removed the old runtime watermark overlay to avoid duplicated branding.

            ## Existing functionality
            CoA/TBC folders, Stable/Beta channels, automatic updates, release filtering, installation and launch controls remain unchanged.
          draft: false
          prerelease: false
          files: |
            RetreatUI_Launcher.exe
            RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
