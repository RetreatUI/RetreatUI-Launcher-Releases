name: Publish RetreatUI Launcher v0.3.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download verified v0.3.3 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4900-81f4-a043-fe8497e3beb4/raw?se=2026-08-06T11%3A11%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=5c5d33c9-b0fc-5dbf-8ca7-085c6d495960&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T07%3A09%3A24Z&ske=2026-08-07T07%3A09%3A24Z&sks=b&skv=2026-02-06&sig=0/p/zF%2BL/vQbeDHKIwN1SpNdlOyR%2BjhIylUP0yORMW8%3D'
          Invoke-WebRequest -Uri $url -OutFile 'artifact.zip'
          Expand-Archive -LiteralPath 'artifact.zip' -DestinationPath 'artifact' -Force

          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe' 'RetreatUI_Launcher.exe'
          Copy-Item 'artifact/publish/RetreatUI_Launcher.exe.sha256' 'RetreatUI_Launcher.exe.sha256'
          Copy-Item 'artifact/RetreatUI_Launcher_win-x64.zip' 'RetreatUI_Launcher_win-x64.zip'

          $expected = (Get-Content 'RetreatUI_Launcher.exe.sha256' -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath 'RetreatUI_Launcher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Checksum mismatch: expected $expected, received $actual"
          }

          $version = (Get-Item 'RetreatUI_Launcher.exe').VersionInfo.FileVersion
          if (!$version.StartsWith('0.3.3')) {
            throw "Unexpected launcher version: $version"
          }

      - name: Publish public launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.3.3
          name: RetreatUI Launcher v0.3.3
          body: |
            ## Approved dark fantasy redesign
            - Replaced the v0.3.2 circular prototype cards with clean rectangular game selectors.
            - Integrated Project Ascension and Burning Crusade branding naturally on the right side of each card.
            - Removed oversized glows, badges and other visual noise.
            - Added a subtle dark texture, restrained gold accents and elegant fantasy-style headings.
            - Reduced the selected-game background logo to a soft atmospheric detail instead of an obvious pasted image.

            ## Existing functionality
            CoA/TBC folders, Stable/Beta channels, automatic updates, release filtering, installation and launch controls remain unchanged.
          draft: false
          prerelease: false
          files: |
            RetreatUI_Launcher.exe
            RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
